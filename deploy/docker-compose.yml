# Elenchos Studio on the hackathon VPS behind Coolify's Traefik (network "coolify"), same pattern as /opt/hk/yojimbo.
# Server layout: /opt/hk/elenchos/.env (mode 600: ANTHROPIC_API_KEY, piped from the Mac, never printed) and
# /opt/hk/elenchos/app (git archive of main). Redeploy from the Mac: deploy/redeploy.sh. On the server:
#   cd /opt/hk/elenchos/app && flock /opt/hk/.build.lock docker compose -f deploy/docker-compose.yml up -d --build
name: elenchos
services:
  studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hk-elenchos:latest
    restart: unless-stopped
    init: true
    mem_limit: 1200m
    memswap_limit: 1500m
    cpus: 1.0
    env_file:
      - path: ../../.env
        required: true
    environment:
      PORT: "8787"
      NODE_OPTIONS: --max-old-space-size=700
      # Public studio: each visitor gets a few agent investigations an hour (the scan button is unlimited and free).
      ELENCHOS_INVESTIGATIONS_PER_HOUR: "5"
      # Shareable reports live outside the container so they survive rebuilds.
      ELENCHOS_DATA: /data
      ELENCHOS_PUBLIC_API: https://elenchos.201-18-198-162.sslip.io
    volumes:
      - /opt/hk/elenchos/data:/data
    networks: [coolify]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/targets').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-elenchos.rule=Host(`elenchos.201-18-198-162.sslip.io`)
      - traefik.http.routers.hk-elenchos.entrypoints=https
      - traefik.http.routers.hk-elenchos.tls=true
      - traefik.http.routers.hk-elenchos.tls.certresolver=letsencrypt
      - traefik.http.services.hk-elenchos.loadbalancer.server.port=8787
networks:
  coolify:
    external: true
