<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How a zkVerify aggregation leaf is built and checked">
  <style>
    .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f4f3}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f2f4f3}
    .dim{fill:#a6adb6}.faint{fill:#6b7380}.lime{fill:#c6f24e}.red{fill:#ff6b6b}
    .box{fill:#121418;stroke:#2b3038;stroke-width:1.5}
    .hot{fill:#2a1416;stroke:#ff6b6b;stroke-width:2}
    .ok{fill:#16200c;stroke:#c6f24e;stroke-width:1.5}
    .ar{stroke:#6b7380;stroke-width:1.8;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7380"/></marker></defs>
  <rect width="1200" height="470" rx="18" fill="#0a0b0d"/>
  <text x="40" y="52" class="m lime" font-size="15" letter-spacing="1.5">WHAT ZKVERIFY ACTUALLY CHECKS</text>
  <text x="40" y="86" class="t" font-size="26" font-weight="600">A receipt proves a leaf is in an aggregation. Your contract builds the leaf.</text>

  <rect x="40" y="128" width="250" height="92" rx="12" class="box"/>
  <text x="58" y="158" class="m dim" font-size="14">provingSystemId</text>
  <text x="58" y="186" class="m" font-size="15">keccak256("groth16")</text>
  <text x="58" y="207" class="m faint" font-size="12">fixed for Groth16</text>

  <rect x="306" y="128" width="250" height="92" rx="12" class="hot"/>
  <text x="324" y="158" class="m red" font-size="14">vkHash  ← who picks this?</text>
  <text x="324" y="186" class="m" font-size="15">which circuit</text>
  <text x="324" y="207" class="m faint" font-size="12">pin it, or the caller decides</text>

  <rect x="572" y="128" width="250" height="92" rx="12" class="box"/>
  <text x="590" y="158" class="m dim" font-size="14">versionHash</text>
  <text x="590" y="186" class="m" font-size="15">sha256("")</text>
  <text x="590" y="207" class="m faint" font-size="12">no version</text>

  <rect x="838" y="128" width="322" height="92" rx="12" class="box"/>
  <text x="856" y="158" class="m dim" font-size="14">keccak256(public inputs)</text>
  <text x="856" y="186" class="m" font-size="15">32-byte little-endian words</text>
  <text x="856" y="207" class="m faint" font-size="12">[recipient, amount, nullifier]</text>

  <path class="ar" d="M165 222 V262 H560"/><path class="ar" d="M431 222 V262"/><path class="ar" d="M697 222 V262"/><path class="ar" d="M999 222 V262 H700"/>
  <rect x="290" y="262" width="620" height="58" rx="12" class="box"/>
  <text x="600" y="298" text-anchor="middle" class="m" font-size="17">leaf = keccak256( id ‖ vkHash ‖ version ‖ inputsHash )</text>

  <path class="ar" d="M600 322 V352"/>
  <rect x="70" y="352" width="1060" height="58" rx="12" class="ok"/>
  <text x="600" y="387" text-anchor="middle" class="m" font-size="15.5">zkVerify.verifyProofAggregation(domainId, aggregationId, leaf, merklePath, leafCount, index) → bool</text>
  <text x="600" y="446" text-anchor="middle" class="t dim" font-size="16">zkVerify answers "is this leaf in aggregation #N?" — never "is this the circuit you meant to trust?"</text>
</svg>
